<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">V2TEKSOL Share Card</title>
  <desc id="desc">Share-sized V2TEKSOL business card graphic for WhatsApp or email.</desc>
  <defs>
    <linearGradient id="shareBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f1fa"/>
      <stop offset="52%" stop-color="#ececf7"/>
      <stop offset="100%" stop-color="#dfe7f8"/>
    </linearGradient>
    <linearGradient id="sharePanel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#eef2fb" stop-opacity="0.78"/>
    </linearGradient>
    <linearGradient id="shareAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7091e6"/>
      <stop offset="100%" stop-color="#3d52a0"/>
    </linearGradient>
    <filter id="shareShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#3d52a0" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#shareBg)"/>
  <path d="M1025 56 H1510" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="4"/>
  <path d="M1023 56 C1092 56 1123 56 1150 83 C1177 110 1177 141 1177 209 L1177 404" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="4"/>
  <circle cx="1290" cy="665" r="110" fill="#7091e6" opacity="0.13"/>
  <path d="M1290 585 C1343 585 1386 628 1386 680 C1386 733 1343 776 1290 776 C1237 776 1194 733 1194 680 C1194 655 1206 635 1222 619 C1241 600 1257 585 1290 585 Z" fill="#7091e6" opacity="0.86" filter="url(#shareShadow)"/>

  <g transform="translate(116 102)">
    <rect x="0" y="0" width="1368" height="696" rx="46" fill="url(#sharePanel)" stroke="#ffffff" stroke-opacity="0.9" filter="url(#shareShadow)"/>

    <g transform="translate(72 78)">
      <rect x="0" y="0" width="468" height="58" rx="29" fill="url(#shareAccent)"/>
      <text x="234" y="38" fill="#ffffff" font-family="'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="3" text-anchor="middle">CAREER GROWTH PARTNER</text>

      <text x="0" y="136" fill="#7091e6" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="700">Practical learning.</text>
      <text x="0" y="220" fill="#7091e6" font-family="'Segoe UI', Arial, sans-serif" font-size="72" font-weight="700">Real guidance.</text>
      <text x="0" y="292" fill="#6a7cad" font-family="'Segoe UI', Arial, sans-serif" font-size="64" font-weight="600">Better outcomes.</text>

      <text x="0" y="458" fill="#3d52a0" font-family="'Segoe UI', Arial, sans-serif" font-size="148" font-weight="800" letter-spacing="2">V2TEKSOL</text>

      <g transform="translate(0 514)">
        <rect x="0" y="0" width="720" height="132" rx="30" fill="#ffffff" fill-opacity="0.72" stroke="#dbe3f4"/>
        <text x="42" y="58" fill="#3d52a0" font-family="'Segoe UI', Arial, sans-serif" font-size="50" font-weight="700">v2teksol@gmail.com</text>
        <text x="42" y="108" fill="#7091e6" font-family="'Segoe UI', Arial, sans-serif" font-size="48" font-weight="700">+918309396620</text>
      </g>
    </g>

    <g transform="translate(1120 122)">
      <rect x="0" y="0" width="170" height="500" rx="34" fill="#ffffff" fill-opacity="0.76" stroke="#edf1fb"/>
      <image href="./assets/Upward%20arrow%20and%20cloud%20logo.png" x="15" y="28" width="140" height="140" preserveAspectRatio="xMidYMid meet"/>
      <text x="85" y="236" fill="#3d52a0" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" text-anchor="middle">V2</text>
      <text x="85" y="276" fill="#3d52a0" font-family="'Segoe UI', Arial, sans-serif" font-size="36" font-weight="800" text-anchor="middle">TEKSOL</text>
      <text x="85" y="346" fill="#7091e6" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.5" text-anchor="middle">REAL</text>
      <text x="85" y="382" fill="#7091e6" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.5" text-anchor="middle">GUIDANCE</text>
      <text x="85" y="418" fill="#7091e6" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.5" text-anchor="middle">BETTER</text>
      <text x="85" y="454" fill="#7091e6" font-family="'Segoe UI', Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="2.5" text-anchor="middle">OUTCOMES</text>
    </g>
  </g>
</svg>
