<svg xmlns="http://www.w3.org/2000/svg" width="3.5in" height="2in" viewBox="0 0 1050 600" role="img" aria-labelledby="title desc">
  <title id="title">V2TEKSOL Business Card Back</title>
  <desc id="desc">Back side of the V2TEKSOL business card with the logo, brand name and contact details in a soft blue-lilac palette.</desc>
  <defs>
    <linearGradient id="bgBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff0f8"/>
      <stop offset="48%" stop-color="#e7ecf8"/>
      <stop offset="100%" stop-color="#d6def4"/>
    </linearGradient>
    <linearGradient id="stripBack" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3d52a0"/>
      <stop offset="100%" stop-color="#7091e6"/>
    </linearGradient>
    <filter id="shadowBack" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#3d52a0" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1050" height="600" rx="42" fill="url(#bgBack)"/>
  <rect x="54" y="54" width="942" height="492" rx="38" fill="#ffffff" fill-opacity="0.62" stroke="#f8f9fe" filter="url(#shadowBack)"/>
  <rect x="54" y="54" width="18" height="492" rx="9" fill="url(#stripBack)"/>

  <path d="M692 54 H970" fill="none" stroke="#ffffff" stroke-opacity="0.76" stroke-width="3"/>
  <path d="M692 54 C744 54 768 54 789 75 C810 96 810 119 810 171 L810 268" fill="none" stroke="#ffffff" stroke-opacity="0.76" stroke-width="3"/>

  <g transform="translate(124 105)">
    <image href="./assets/Upward%20arrow%20and%20cloud%20logo.png" x="0" y="0" width="250" height="250" preserveAspectRatio="xMidYMid meet"/>

    <text x="298" y="94" fill="#7091e6" font-family="'Segoe UI', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="4">CAREER GROWTH PARTNER</text>
    <text x="298" y="158" fill="#3d52a0" font-family="'Segoe UI', Arial, sans-serif" font-size="84" font-weight="800" letter-spacing="2">V2TEKSOL</text>
    <text x="298" y="204" fill="#6d7faf" font-family="'Segoe UI', Arial, sans-serif" font-size="28" font-weight="500">Practical learning. Real guidance. Better outcomes.</text>

    <g transform="translate(298 260)">
      <text x="0" y="0" fill="#3d52a0" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700">v2teksol@gmail.com</text>
      <text x="0" y="50" fill="#7091e6" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="700">+918309396620</text>
    </g>
  </g>
</svg>
