    >CAREER GROWTH PARTNER</text>

    <text
      x="0"
      y="68"
      fill="#6e7fae"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="30"
      font-weight="500"
    >Practical learning. Real guidance. Better outcomes.</text>

    <text
      x="0"
      y="186"
      fill="#3d52a0"
      font-family="'Segoe UI', Arial, sans-serif"
      font-size="104"
      font-weight="800"
      letter-spacing="3"
    >V2TEKSOL</text>

    <g transform="translate(0 282)">
      <rect x="0" y="0" width="568" height="138" rx="28" fill="#ffffff" fill-opacity="0.46" stroke="#d7deef" stroke-width="2"/>
      <text
        x="34"
        y="54"
        fill="#7091e6"
        font-family="'Segoe UI', Arial, sans-serif"
        font-size="22"
        font-weight="700"
        letter-spacing="4"
